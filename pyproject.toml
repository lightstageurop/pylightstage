[build-system]
  build-backend = "setuptools.build_meta"
  requires = ["setuptools>=68", "wheel"]

[project]
  authors = [{ name = "Thomas Aldrian", email = "thomas.aldrian24@imperial.ac.uk" }]
  dependencies = ["cbor2", "websockets", "zstandard"]
  description = "Python client for ICL RGI group's Lightstage"
  license = { text = "MIT" }
  name = "pylightstage"
  readme = "README.md"
  requires-python = ">=3.11"
  version = "0.2.0"

  [project.urls]
    Homepage = "https://github.com/lightstageurop/pylightstage"
    Repository = "https://github.com/lightstageurop/pylightstage"
  [project.scripts]
    lscli = "pylightstage.lscli:main"

[dependency-groups]
  dev = [
    "basedpyright>=1.39.9",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
  ]

[tool.setuptools.packages.find]
  where = ["src"]

[tool.pytest.ini_options]
  addopts = "-ra -q -m 'not integration' --cov"
  asyncio_mode = "auto"
  markers = [
    "integration: tests that require lsserver to be running",
    "unit: isolated unit tests, do not require lsserver",
  ]
  minversion = "6.0"
  pythonpath = ["src"]
  testpaths = ["tests"]

[tool.basedpyright]
  include = ["src"]

[tool.ruff.lint]
  extend-select = ["I"]
