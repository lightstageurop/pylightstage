[build-system]
  build-backend = "setuptools.build_meta"
  requires = ["setuptools>=68", "wheel"]

[project]
  authors = [{ name = "Thomas Aldrian", email = "thomas.aldrian24@imperial.ac.uk" }]
  dependencies = ["cbor2", "websockets", "zstandard"]
  description = "Python client for ICL RGI group's Lightstage"
  license = { text = "MIT" }
  name = "pylightstage"
  readme = "README.md"
  requires-python = ">=3.11"
  version = "0.1.0"

  [project.urls]
    Homepage = "https://github.com/lightstageurop/pylightstage"
    Repository = "https://github.com/lightstageurop/pylightstage"
  [project.scripts]
    lscli = "pylightstage.lsCLI:main"
    lsCLI = "pylightstage.lsCLI:main"

  [project.optional-dependencies]
    dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.setuptools.packages.find]
  where = ["src"]

[tool.pytest.ini_options]
  addopts = "-ra -q -m 'not integration' --cov"
  asyncio_mode = "auto"
  markers = [
    "integration: tests that require lsserver to be running",
    "unit: isolated unit tests, do not require lsserver",
  ]
  minversion = "6.0"
  pythonpath = ["src"]
  testpaths = ["tests"]
